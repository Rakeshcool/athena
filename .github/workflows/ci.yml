name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build (zero warnings) + test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # -warnaserror promotes every compiler/MSBuild warning to an error, so the
      # build stays at the 0-warning bar the codebase currently meets.
      - name: Build
        run: dotnet build Athena.sln -warnaserror --nologo

      # Live-server smoke tests (ASR :8080 / LLM :3000) skip automatically when
      # no local servers are reachable, which is always the case on CI.
      - name: Test
        run: dotnet test Athena.sln --no-build --nologo
